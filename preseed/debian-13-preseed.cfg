### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/keymap select us
d-i keymap select us
d-i keyboard-configuration/xkb-keymap select us


### Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string trixie-templ
d-i netcfg/get_domain string lab


### Mirror settings
d-i mirror/protocol string http
d-i mirror/country string manual
d-i mirror/http/hostname string mirror.xmission.com
d-i mirror/http/directory string /debian
d-i mirror/suite string trixie
d-i mirror/http/proxy string


### Account setup
# Root login disabled; xthor is the primary account with NOPASSWD sudo
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string xthor
d-i passwd/username string xthor
d-i passwd/user-password password p@ssw0rd
d-i passwd/user-password-again password p@ssw0rd
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false


### Clock and time zone setup
d-i clock-setup/utc boolean false
d-i time/zone string US/Mountain
d-i clock-setup/ntp boolean true


### Partitioning
# Auto-detect sda or nvme0n1 and use whichever exists
d-i partman/early_command string \
 DISK=""; \
 for d in nvme0n1 sda; do \
   if [ -b /dev/$d ]; then DISK=/dev/$d; break; fi; \
 done; \
 debconf-set partman-auto/disk "$DISK"; \
 debconf-set grub-installer/bootdev "$DISK"
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select uuid
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true


### Apt
d-i apt-setup/services-select multiselect security, updates, backports
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/use_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true


### Package selection
tasksel tasksel/first multiselect minimal
d-i pkgsel/include string openssh-server rsync chrony acpid sudo less man-db manpages vim python3
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false


### Misc options
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true
d-i finish-install/reboot_in_progress note
d-i finish-install/keep-consoles boolean true


### Postinstall
# - Install xthor's authorized_keys
# - Grant xthor NOPASSWD sudo
# - Show v4/v6 addresses on the login banner
d-i preseed/late_command string \
 in-target sh -c 'install -d -o xthor -g xthor -m 0700 /home/xthor/.ssh && \
   { \
     echo "ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBTwUxyjPuBQJDHcP4lzarhNn/vNd6qEPg1ndCGzRCoFTzNHt3D+QZQELDX7Mcstlc+Lx5KFoi83AdPCv02rri4= # m4 mac mini"; \
     echo "ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBM/ImWv7UDLqSJAMv8yWg/G5IEAt/sX4tt7g8JoJIDDjIVTCRdURmmqiSY0yyapWatLq4neuBaUB0YWMvkHGxcI= # m4 pro mac mini (anansi)"; \
     echo "ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBMLTypAZxkdv2sceHV9BbeuPRiZ2NNAWi6NYgGjOq8Q3YyitHl0H0M5vlgVdgdGvCq8dd7jXPAXCxZvBoUo+V/E= # m4 pro macbook pro 14 (jorogumo)"; \
     echo "ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOBYtGg5nXQs6XxYk6ZUrbMzE76XFFzxQ12WgyZ8Dref6yZycKRCtgFfgi0UGbQd9GusbAPr1UUq//Gn5MtBIKg= # intel 12600k mini itx (maratus)"; \
     echo "ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKNKNe2m3A68fLpqqjVpNvCGCZIgfY1LtydM2itBeVaU4WtH68CABr1w9tviDtXWeuCkyqBnEGZV3SLrkwYK/5M= # x1 carbon 11th gen (iktomi)"; \
   } > /home/xthor/.ssh/authorized_keys && \
   chown xthor:xthor /home/xthor/.ssh/authorized_keys && \
   chmod 0600 /home/xthor/.ssh/authorized_keys'; \
 in-target sh -c 'echo "xthor ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/xthor && chmod 0440 /etc/sudoers.d/xthor'; \
 in-target sh -c 'echo "IPv4: \\\4" >> /etc/issue && echo "IPv6: \\\6" >> /etc/issue && echo "" >> /etc/issue';


### Finish it up
d-i debian-installer/splash boolean false
d-i cdrom-detect/eject boolean true
